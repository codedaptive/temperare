# Code Chi Tao's own rule file: the repository is checked by itself (mission, How the code is written; Done 8;
# SPEC-selfcheck WO-orc-selfcheck-1; S-25, S-26). It takes standard@1, the first repository on the baseline (Bob #2235),
# and house@2 for its three register-citation rules alone (WO-orc-selfcheck-2): house@2's other 36 rules are off.
version = 1
owner = "maintainers"
baseline = ["standard@1", "house@2"]

[kits.procio]
paths = ["crates/procio/**"]
owner = "procio"

# The baseline sets' cases (crates/rules/baseline/<set>/<version>/cases) are example code that fails on purpose,
# frozen as released (Orc #2200). Each standard@1 rule that finds one of them leaves them out (S-64).

[[override]]
rule = "tm-rust-suppression"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-swift-suppression"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-python-suppression"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-javascript-suppression"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-typescript-suppression"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-go-suppression"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-c-suppression"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-cpp-suppression"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-swift-blanket-disable"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-python-blanket-noqa"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-python-unused-import"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-python-unused-variable"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-python-complexity"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-swift-complexity"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-python-print"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-python-bare-except"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-python-blind-except"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-python-commented-out-code"
exclude = ["crates/rules/baseline/**"]

# house@2 brings in the register-citation check alone (Tao step 4.4): its three citation rules leave the sets' cases out,
# as the standard@1 rules do, and its other 36 rules are off (whether to take them is a separate question).

[[override]]
rule = "tm-house-no-register-citation-rust"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-house-no-register-citation-swift"
exclude = ["crates/rules/baseline/**"]

[[override]]
rule = "tm-house-no-register-citation-python"
