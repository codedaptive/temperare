id = "tm-javascript-suppression"
engine = "ast-grep"
kind = "quality"
check = "ast-grep/tm-javascript-suppression.yml"
paths = ["**/*.js", "**/*.mjs", "**/*.cjs", "**/*.jsx"]
severity = "warning"
enforces = """\
