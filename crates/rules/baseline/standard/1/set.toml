whose NOLINTBEGIN is the finding. Checks turned off in .clang-tidy, a #pragma diagnostic ignored, and a NOLINT a \
macro expands to."""
fix = """\
Remove the suppression and fix what it hid; if the finding must stay, record it as an [[exception]] in the rule \
file, with its reason and expiry date: that is where an exception lives."""
failing = { files = ["a.cpp"], path = "a.cpp", line = 2 }
passing = { files = ["a.cpp"] }

[[rule]]
id = "tm-rust-allow-without-reason"
engine = "clippy"
kind = "quality"
check = "clippy::allow_attributes_without_reason"
paths = ["**/*.rs"]
severity = "warning"
enforces = """\
A suppression names its reason: clippy's stock allow_attributes_without_reason, which also reports #[expect] \
and an allow built by cfg_attr or a macro."""
leaves = """\
An allow or expect that names a reason, whatever the reason says. A lint level set outside the code: [lints] in \
Cargo.toml, -A flags, clippy.toml. Code under a cfg that is off in this build."""
fix = """\
Remove the suppression and fix what it hid; if the finding must stay, record it as an [[exception]] in the rule \
file, with its reason and expiry date: that is where an exception lives."""
failing = { files = ["Cargo.toml", "src/lib.rs"], path = "src/lib.rs", line = 1 }
passing = { files = ["Cargo.toml", "src/lib.rs"] }

[[rule]]
id = "tm-swift-blanket-disable"
engine = "swiftlint"
kind = "quality"
check = "blanket_disable_command"
paths = ["**/*.swift"]
severity = "warning"
enforces = """\
A suppression is scoped, not left on for the rest of the file: SwiftLint's stock blanket_disable_command."""
leaves = """\
A scoped disable (:next, :this, :previous), and a disable that a later swiftlint:enable closes, however much code \
lies between them. A rule turned off in .swiftlint.yml."""
fix = """\
Remove the suppression and fix what it hid; if the finding must stay, record it as an [[exception]] in the rule \
file, with its reason and expiry date: that is where an exception lives."""
failing = { files = ["a.swift"], path = "a.swift", line = 1 }
passing = { files = ["a.swift"] }

[[rule]]
id = "tm-python-blanket-noqa"
engine = "ruff"
kind = "quality"
check = "PGH004"
paths = ["**/*.py"]
severity = "warning"
enforces = """\
A suppression names what it silences: ruff's stock PGH004, a noqa with no rule code."""
leaves = """\
A noqa that names a code, right or wrong for its line. A blanket # type: ignore (ruff's PGH003) and a blanket \
# pylint: disable. Ignores in ruff's configuration."""
fix = """\
Remove the suppression and fix what it hid; if the finding must stay, record it as an [[exception]] in the rule \
file, with its reason and expiry date: that is where an exception lives."""
failing = { files = ["a.py"], path = "a.py", line = 1 }
passing = { files = ["a.py"] }

[[rule]]
id = "tm-swift-complexity"
engine = "swiftlint"
kind = "quality"
check = "cyclomatic_complexity"
paths = ["**/*.swift"]
severity = "warning"
params = { max_complexity = 10 }
enforces = """\
No function with cyclomatic complexity over 10: SwiftLint's stock cyclomatic_complexity, its threshold the \
max_complexity param."""
leaves = """\
Nesting depth and function length, which are other rules. SwiftLint counts every case of a switch, so a flat \
switch over many values is reported as complex while deep nesting with few branches is not."""
fix = """\
Split the function: move one whole responsibility into a function of its own, or replace a long branch chain with \
a lookup table."""
failing = { files = ["Status.swift"], path = "Status.swift", line = 2 }
passing = { files = ["Status.swift"] }

[[rule]]
id = "tm-python-complexity"
engine = "ruff"
kind = "quality"
check = "C901"
paths = ["**/*.py"]
severity = "warning"
params = { max_complexity = 10 }
enforces = """\
No function with cyclomatic complexity over 10: ruff's stock C901 (mccabe), its threshold the max_complexity \
param."""
leaves = """\
Nesting depth and function length, which are other rules. Conditions joined with `and` or `or` in one test count \
as one branch, so a long compound condition is not reported."""
fix = """\
Split the function: move one whole responsibility into a function of its own, or replace a long branch chain with \
a lookup table."""
failing = { files = ["status.py"], path = "status.py", line = 4 }
passing = { files = ["status.py"] }

[[rule]]
id = "tm-rust-nesting"
engine = "clippy"
kind = "quality"
check = "clippy::excessive_nesting"
paths = ["**/*.rs"]
severity = "warning"
params = { max_nesting = 6 }
enforces = """\
No heavy nesting: clippy's stock excessive_nesting at max_nesting = 6, which leaves a method in an impl four \
levels of branches and closures."""
leaves = """\
Clippy counts every block and item body, so the same code is reported sooner inside an impl or an inline mod than \
as a free function. Complexity and length, which are other rules."""
fix = """\
Flatten it: return early, use `?` or let-else, join conditions, or move the inner body into a function of its \
own."""
failing = { files = ["Cargo.toml", "src/lib.rs"], path = "src/lib.rs", line = 21 }
passing = { files = ["Cargo.toml", "src/lib.rs"] }

[[rule]]
id = "tm-rust-dbg"
engine = "clippy"
kind = "quality"
check = "clippy::dbg_macro"
paths = ["**/*.rs"]
severity = "warning"
enforces = "No debug output left in: clippy's stock dbg_macro."
leaves = """\
Other debug output: println!, eprintln! and log calls left in (house@1's print_stdout covers library paths). A dbg! \
in code under a cfg that is off in this build."""
fix = "Remove the dbg! call, keeping the expression inside it."
failing = { files = ["Cargo.toml", "src/lib.rs"], path = "src/lib.rs", line = 5 }
passing = { files = ["Cargo.toml", "src/lib.rs"] }

[[rule]]
id = "tm-python-print"
engine = "ruff"
kind = "quality"
check = "T201"
paths = ["**/*.py"]
severity = "warning"
enforces = "No debug output left in: ruff's stock T201."
leaves = "Other debug output: pprint (ruff's T203), writes to sys.stdout or sys.stderr, and logging calls left in."
fix = "Remove the print; to tell a user or a log something, use the module's logger."
failing = { files = ["orders.py"], path = "orders.py", line = 7 }
passing = { files = ["orders.py"] }

[[rule]]
id = "tm-python-bare-except"
engine = "ruff"
kind = "quality"
check = "E722"
paths = ["**/*.py"]
severity = "warning"
enforces = "No bare except: ruff's stock E722."
leaves = """\
A catch of Exception or BaseException, which tm-python-blind-except reports. A handler of a narrow type that \
swallows the error with `pass`."""
fix = "Catch the exception types the block expects, such as `except ValueError:`."
failing = { files = ["ports.py"], path = "ports.py", line = 8 }
passing = { files = ["ports.py"] }

[[rule]]
id = "tm-python-blind-except"
engine = "ruff"
kind = "quality"
check = "BLE001"
paths = ["**/*.py"]
severity = "warning"
enforces = "No blanket except: ruff's stock BLE001."
leaves = """\
A bare except, which tm-python-bare-except reports. A blanket handler that re-raises, or logs with \
logging.exception or exc_info, which BLE001 accepts."""
fix = "Catch the exception types the block expects, or re-raise after handling."
failing = { files = ["ports.py"], path = "ports.py", line = 8 }
passing = { files = ["ports.py"] }

[[rule]]
id = "tm-python-commented-out-code"
engine = "ruff"
kind = "quality"
check = "ERA001"
paths = ["**/*.py"]
severity = "warning"
enforces = "No commented-out code: ruff's stock ERA001."
leaves = """\
Commented-out code that ruff's heuristic reads as prose, such as a single word or a call inside a sentence; code \
kept in a string or a docstring; a block disabled with `if False:`."""
fix = "Delete the commented-out code; git keeps it. If it explains something, say it in prose."
