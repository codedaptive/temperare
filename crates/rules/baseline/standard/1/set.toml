# The baseline set "standard", version 1: the rules any team would take, per language and for any language.
# A rule file takes it with `baseline = ["standard@1"]`. Once released, this version is frozen; a change is version 2.
# The rules come in this order: dead code, deprecated calls and suppressions first, since an agent copies what it
# sees in the code most; then the other checks any team would take; then what a change adds.

version = 1

[[rule]]
id = "tm-rust-dead-code"
engine = "clippy"
kind = "quality"
check = "dead_code"
paths = ["**/*.rs"]
severity = "warning"
enforces = """\
Dead code is removed, since git keeps it and an agent copies what it sees: rustc's stock dead_code lint, run \
through clippy."""
leaves = """\
Swift: SwiftLint's unused_declaration is an analyzer rule that needs a build log, which the adapter does not run. \
A Python function nothing calls: ruff has no such check. An export no other file uses (Tessera's unused-export), \
including a pub item of a library crate that nothing calls. Code under a cfg that is off in this build, and \
a branch inside a used function that can never run."""
fix = "Delete the unused item; git keeps it. If it is meant to be used, call it from the code that needs it."
failing = { files = ["Cargo.toml", "src/lib.rs"], path = "src/lib.rs", line = 8 }
passing = { files = ["Cargo.toml", "src/lib.rs"] }

[[rule]]
id = "tm-rust-unused-imports"
engine = "clippy"
kind = "quality"
check = "unused_imports"
paths = ["**/*.rs"]
severity = "warning"
enforces = """\
No unused import is left in, since it is dead code and an agent copies what it sees: rustc's stock \
unused_imports lint, run through clippy."""
leaves = """\
Swift: SwiftLint's unused_import is an analyzer rule that needs a build log, which the adapter does not run. A pub \
use re-export no other file uses (Tessera's unused-export). An import in code under a cfg that is off in this \
build."""
fix = "Remove the import."
failing = { files = ["Cargo.toml", "src/lib.rs"], path = "src/lib.rs", line = 4 }
passing = { files = ["Cargo.toml", "src/lib.rs"] }

[[rule]]
id = "tm-rust-unused-variables"
engine = "clippy"
kind = "quality"
check = "unused_variables"
paths = ["**/*.rs"]
severity = "warning"
enforces = """\
No unused variable is left in, since it is dead code and an agent copies what it sees: rustc's stock \
unused_variables lint, run through clippy."""
leaves = """\
Swift: SwiftLint's unused_declaration is an analyzer rule that needs a build log, which the adapter does not run. \
A name starting with `_`, which rustc takes as unused on purpose. A value assigned and then overwritten before it \
is read (rustc's unused_assignments), and a struct field written but never read."""
fix = "Remove the variable, or use it where it was meant to be used."
failing = { files = ["Cargo.toml", "src/lib.rs"], path = "src/lib.rs", line = 5 }
passing = { files = ["Cargo.toml", "src/lib.rs"] }

[[rule]]
id = "tm-python-unused-import"
engine = "ruff"
kind = "quality"
check = "F401"
paths = ["**/*.py"]
severity = "warning"
enforces = """\
No unused import is left in, since it is dead code and an agent copies what it sees: ruff's stock F401, \
pyflakes' unused import."""
leaves = """\
A Python function nothing calls: ruff has no such check. An export no other file uses (Tessera's unused-export). \
An import named in `__all__` or written `import x as x`, which ruff reads as a re-export even when nothing \
imports it from there."""
fix = "Remove the import."
failing = { files = ["settings.py"], path = "settings.py", line = 4 }
passing = { files = ["settings.py"] }

[[rule]]
id = "tm-python-unused-variable"
engine = "ruff"
kind = "quality"
check = "F841"
paths = ["**/*.py"]
severity = "warning"
enforces = """\
No unused local variable is left in, since it is dead code and an agent copies what it sees: ruff's stock \
F841, pyflakes' unused variable."""
leaves = """\
A Python function nothing calls: ruff has no such check. An export no other file uses (Tessera's unused-export). \
A name bound by tuple unpacking, a name starting with `_`, and a name at module or class level: F841 checks \
only plain local assignments."""
fix = "Remove the assignment, keeping the call on its right if its effect is needed."
failing = { files = ["orders.py"], path = "orders.py", line = 7 }
passing = { files = ["orders.py"] }

[[rule]]
id = "tm-rust-deprecated"
engine = "clippy"
kind = "quality"
check = "deprecated"
paths = ["**/*.rs"]
severity = "warning"
enforces = """\
A deprecated path is not still called, since an agent copies the nearest call: rustc's stock deprecated lint, \
run through clippy."""
leaves = """\
Swift and Python deprecations, which only a compiler or the runtime reports. An API deprecated only in its docs, \
without #[deprecated]; an item deprecated from a later version (rustc's deprecated_in_future); a call in code under \
a cfg that is off in this build."""
fix = "Call the replacement the deprecation note names."
failing = { files = ["Cargo.toml", "src/lib.rs"], path = "src/lib.rs", line = 5 }
passing = { files = ["Cargo.toml", "src/lib.rs"] }

[[rule]]
id = "tm-rust-suppression"
engine = "ast-grep"
kind = "quality"
check = "ast-grep/tm-rust-suppression.yml"
paths = ["**/*.rs"]
severity = "warning"
enforces = """\
A suppression written in the code is reported, since the rule file is the only home for an exception: an \
#[allow(...)] or #![allow(...)] attribute, found by ast-grep."""
leaves = """\
An #[expect(...)] attribute, an allow built by #[cfg_attr(..., allow(...))] or written inside a macro_rules body \
(clippy's allow_attributes_without_reason sees those when they carry no reason). A lint level set outside the \
code: [lints] in Cargo.toml, -A flags, clippy.toml. An allow with a reason is still reported here: whether it \
names one is tm-rust-allow-without-reason's question."""
fix = """\
Remove the suppression and fix what it hid; if the finding must stay, record it as an [[exception]] in the rule \
file, with its reason and expiry date: that is where an exception lives."""
failing = { files = ["src/lib.rs"], path = "src/lib.rs", line = 2 }
passing = { files = ["src/lib.rs"] }

[[rule]]
id = "tm-swift-suppression"
engine = "ast-grep"
kind = "quality"
check = "ast-grep/tm-swift-suppression.yml"
paths = ["**/*.swift"]
severity = "warning"
enforces = """\
A suppression written in the code is reported, since the rule file is the only home for an exception: a \
swiftlint:disable comment in any of its forms (plain, :next, :this, :previous), found by ast-grep."""
leaves = """\
A rule turned off in .swiftlint.yml (disabled_rules, excluded paths), which is configuration, not code. Other \
tools' comments in Swift, such as // periphery:ignore. A swiftlint:enable is not reported: its disable is."""
fix = """\
Remove the suppression and fix what it hid; if the finding must stay, record it as an [[exception]] in the rule \
file, with its reason and expiry date: that is where an exception lives."""
failing = { files = ["a.swift"], path = "a.swift", line = 2 }
passing = { files = ["a.swift"] }

[[rule]]
id = "tm-python-suppression"
engine = "ast-grep"
kind = "quality"
check = "ast-grep/tm-python-suppression.yml"
paths = ["**/*.py", "**/*.pyi"]
severity = "warning"
enforces = """\
A suppression written in the code is reported, since the rule file is the only home for an exception: a noqa \
(any case, line or file level, ruff: and flake8: forms included), type: ignore or pylint: disable directive, at the \
start of a comment or after a later #, found by ast-grep."""
leaves = """\
Suppressions in configuration: ruff's ignore and per-file-ignores, mypy's and pylint's settings. Comment forms \
this rule does not look for: # pyright: ignore, # nosec, # pragma: no cover, # fmt: off. A directive named in prose \
(# Explain why a noqa would hide this). Files ast-grep reads as \
Python under other names (.py3, .bzl): the paths keep to .py and .pyi. An unused noqa: ruff's RUF100 needs the \
codes it suppresses selected, which tm's one-rule runs do not do."""
fix = """\
Remove the suppression and fix what it hid; if the finding must stay, record it as an [[exception]] in the rule \
file, with its reason and expiry date: that is where an exception lives."""
failing = { files = ["a.py"], path = "a.py", line = 5 }
passing = { files = ["a.py"] }

