[[rule]]
id = "tm-c-suppression"
engine = "ast-grep"
kind = "quality"
check = "ast-grep/tm-c-suppression.yml"
paths = ["**/*.c", "**/*.h"]
severity = "warning"
enforces = """\
A suppression written in the code is reported, since the rule file is the only home for an exception: a \
NOLINT, NOLINTNEXTLINE or NOLINTBEGIN comment, found by ast-grep."""
leaves = """\
Objective-C (.m): ast-grep does not parse it, so a NOLINT there is not seen. A C++ header named .h is read here \
as C, since ast-grep maps .h to C. A NOLINTEND, whose NOLINTBEGIN is the finding. Checks turned off in \
.clang-tidy, a #pragma diagnostic ignored, and a NOLINT a macro expands to."""
fix = """\
Remove the suppression and fix what it hid; if the finding must stay, record it as an [[exception]] in the rule \
file, with its reason and expiry date: that is where an exception lives."""
failing = { files = ["a.c"], path = "a.c", line = 2 }
passing = { files = ["a.c"] }

