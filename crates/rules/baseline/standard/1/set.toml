[[rule]]
id = "tm-change-adds-sleep-rust"
engine = "ast-grep"
kind = "quality"
check = "ast-grep/tm-change-adds-sleep-rust.yml"
paths = ["**/*.rs"]
severity = "warning"
only_with_base = true
enforces = """\
What a change adds is reported, stated as a fact: \
an added sleep, a wait on the clock in place of the event it stands for: \
a call of thread::sleep or tokio::time::sleep (with or without std:: or tokio::), found by ast-grep."""
leaves = """\
A wait made some other way: a bare sleep(...) after use std::thread::sleep, async_std::task::sleep, sleep_until, \
a timeout or a busy loop on Instant used as a pause. A sleep already in the code: the rule runs only with --base."""
fix = """\
Say in the change what the sleep waits for, or wait on that event instead."""
failing = { files = ["worker.rs"], path = "worker.rs", line = 11 }
passing = { files = ["worker.rs"] }

