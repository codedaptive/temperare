[[rule]]
id = "tm-house-unit-test-fakes-own-kit-rust"
engine = "ast-grep"
kind = "quality"
check = "ast-grep/tm-house-unit-test-fakes-own-kit-rust.yml"
paths = ["**/src/**/*_tests.rs"]
severity = "warning"
only_with_base = true
enforces = """\
A unit test does not fake its own package's code: a test that reaches code of its own package that is not pure \
is an integration test, not a unit test, and runs that code for real. Reported: in a sibling *_tests.rs under \
src/, an added #[automock] or mock! (mockall), or an impl of a crate::... or super::... trait for a struct or \
enum the test file defines, found by ast-grep."""
leaves = """\
A fake through a trait imported by name, a closure seam, and Swift, where a protocol's home cannot be told from the \
test file (Tessera's graph can, later). An impl for a generic or path type (impl<T> crate::Store for Wrapper<T>), \
a fake in a helper file that is not a *_tests.rs, #[cfg_attr(test, automock)] on the trait in the code itself, and \
tests inline in a #[cfg(test)] module of a source file."""
fix = """\
file it as an integration test and use its own package's code for real; do not fake it, and do not split the test."""
failing = { files = ["src/store_tests.rs"], path = "src/store_tests.rs", line = 7 }
passing = { files = ["src/store_tests.rs"] }

