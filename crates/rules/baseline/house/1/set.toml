S-58; Bob #1414; the study F10: 17% of Python tests assert a string of five words or more; the zone-tests skill: \
"Never assert a sentence"): an added assert_eq! or assert_ne! with a string literal of five or more words \
(split on whitespace) as one of its two values, or an assert! around .contains(...) of such a literal, found by \
ast-grep."""
leaves = """\
A sentence built at run time or read from a fixture file, and an assertion made through a helper. An assertion's \
message (after the second comma of assert_eq! and assert_ne!, after the first argument of assert!) is not asserted \
and not reported. A sentence compared inside assert! (==, \
starts_with), debug_assert_eq!, and a macro called by its path (std::assert_eq!). Escapes are read as written, so \
\\n does not split two words."""
fix = """\
Assert what the code decides (a field, a code, a count), not its wording: a pinned sentence turns every rewording \
into a test change."""
failing = { files = ["describe_tests.rs"], path = "describe_tests.rs", line = 7 }
passing = { files = ["describe_tests.rs"] }

