[[rule]]
id = "tm-house-test-setup-heavier-rust"
engine = "ast-grep"
kind = "quality"
check = "ast-grep/tm-house-test-setup-heavier-rust.yml"
paths = ["**/tests/**/*.rs", "**/*_tests.rs"]
severity = "warning"
params = { count = "setup-vs-tests", shared_setup = ["**/tests/common/**"] }
only_with_base = true
enforces = """\
A test file holds no more setup than tests, since setup repeated word for word across test files belongs in one \
shared file: ast-grep's count mode \
runs a rule matching the file's root node and each test function (a fn marked #[test] or #[<runtime>::test], with its attributes) and reports a file the \
change adds lines to whose non-blank lines outside a test function exceed those inside one, at the file's first \
added line; the shared setup files are exempt."""
leaves = """\
A test marked by another attribute (#[test_case], #[rstest]), a comment between a test's attributes and its fn \
(counted as setup), and setup shared through a file the shared_setup globs do not name. Tests inline in a \
#[cfg(test)] module of a source file are outside the paths."""
fix = """\
move the setup to the folder's shared setup file, or fold the cases into one table test."""
failing = { files = ["tests/parse.rs"], path = "tests/parse.rs", line = 3 }
passing = { files = ["tests/parse.rs"] }

