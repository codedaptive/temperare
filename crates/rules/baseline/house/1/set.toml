[[rule]]
id = "tm-house-test-ratio"
engine = "git"
kind = "quality"
check = "test_ratio"
paths = ["**/*.rs", "**/*.py", "**/*.swift"]
severity = "warning"
params = { max_ratio = 1.5, floor = 40, test_paths = ["**/tests/**", "**/*_tests.rs", "**/test_*.py", "**/*_test.py", "**/*Tests/**", "**/*Tests.swift"] }
only_with_base = true
enforces = """\
Tests no larger than the code (SPEC-baseline house@1, tests no larger than the code, rule 1; S-58; Bob #1414; the \
zone-tests skill: "More than one and a half lines of test per line of code needs a reason"): git's own diff against \
the base counts the lines the change adds, a file matching test_paths as test and every other file in the rule's \
paths as code, and once the change adds at least floor lines of test, more than max_ratio lines of test per line of \
code is reported, at the first added line of the test file with the most added lines: "this change adds T lines of \
test for C lines of code (R to 1; the rule's limit is M past F lines)"."""
leaves = """\
Rust tests inline in a #[cfg(test)] module count as code. A test file the test_paths globs do not name counts as \
code, and a file outside the rule's paths (a JSON or text fixture, another language) counts as neither."""
fix = """\
Keep the tests to what the change's done list names, with one table test per function, or say in the change why \
its tests must be this large."""
failing = { files = ["src/lib.rs", "tests/parse.rs", "tests/format.rs"], path = "tests/parse.rs", line = 1 }
passing = { files = ["src/lib.rs", "tests/parse.rs", "tests/format.rs"] }

[[rule]]
