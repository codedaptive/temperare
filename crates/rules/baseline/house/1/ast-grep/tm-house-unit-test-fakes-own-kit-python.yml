# {{own_package}} is the kit's top-level package, one identifier, and is filled in as written. Names and module
# names are compared with it by pattern, which matches that exact identifier and nothing else, so only the target
# string's prefix is a regex holding it.
id: tm-house-unit-test-fakes-own-kit-python
language: python
message: this unit test fakes code of its own kit
severity: warning
utils:
  patch-call:
    regex: '^(patch|(\w+\.)*mock\.patch|mocker\.patch)$'
  # The own package, or an attribute chain whose leftmost name is the own package (ledger.store.Store).
  own-ref:
    any:
      - pattern: '{{own_package}}'
      - kind: attribute
        has: { field: object, matches: own-ref }
  # A dotted module name whose first part is the own package (from ledger.store import ..., import ledger.store).
  own-dotted:
    kind: dotted_name
    has: { nthChild: 1, pattern: '{{own_package}}' }
  # A module or class of the own package: named through the package, or imported from it by name.
  own-module:
    any:
      - matches: own-ref
      - kind: identifier
        pattern: $MODULE
        inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            any:
              - kind: import_from_statement
                all:
                  - has: { field: module_name, matches: own-dotted }
                  - has:
                      field: name
                      any:
                        - pattern: $MODULE
                        - { kind: aliased_import, has: { field: alias, pattern: $MODULE } }
              - kind: import_statement
                has:
                  kind: aliased_import
                  all:
                    - has: { field: name, matches: own-dotted }
                    - has: { field: alias, pattern: $MODULE }
rule:
  kind: call
  any:
    # patch("<own>.…"), mock.patch("<own>.…"), mocker.patch("<own>.…"): the text right after the opening quote.
    - all:
        - has: { field: function, matches: patch-call }
        - has:
            field: arguments
            has:
              nthChild: 1
              kind: string
              has: { nthChild: 2, kind: string_content, regex: '^{{own_package}}\.' }
    # patch.object(<own module>, "…")
    - all:
        - has: { field: function, kind: attribute, all: [{ has: { field: object, matches: patch-call } }, { has: { field: attribute, regex: ^object$ } }] }
        - has: { field: arguments, has: { nthChild: 1, matches: own-module } }
