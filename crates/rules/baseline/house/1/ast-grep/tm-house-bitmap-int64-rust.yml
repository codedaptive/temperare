# A bitmap stored on a listed entity type as anything but i64 (entity-style: "ALWAYS `Int64`, never `Int` or
# `Int32`"; bitmap-patterns-core: "ALWAYS use `Int64` — never `Int`, never `Int32`."). {{entity_types}} comes from the rule's entity_types param. A bitmap is a named
# field whose name ends in _bitmap or _flags (operational_bitmap, entity_flags). Option<i64> is reported too: a
# bitmap's column is NOT NULL with a default, so the field is never optional. Each match is anchored to the type's
# own body, as in tm-house-no-stored-bool-rust. $FOUND is the field's type.
id: tm-house-bitmap-int64-rust
language: rust
message: bitmap $TYPE.$FIELD on a persisted entity is $FOUND, not i64
severity: error
rule:
  kind: field_declaration
  has:
    field: type
    pattern: $FOUND
    not:
      regex: ^((std|core)::primitive::)?i64$
  all:
    - has:
        field: name
        regex: '\w_(bitmap|flags)$'
        pattern: $FIELD
  inside:
    kind: field_declaration_list
    inside:
      kind: struct_item
      has:
        field: name
        regex: ^({{entity_types}})$
        pattern: $TYPE
