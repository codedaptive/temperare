# A Bool stored directly on a listed entity type. {{entity_types}} comes from the rule's entity_types param. Swift
# parses struct, class and actor as class_declaration. The type annotation's text includes its colon, and is
# matched whole so [Bool] and [String: Bool] pass. static and class members are not stored on the row; a computed
# property is not stored.
# Each match is anchored to the type's own body, so a Bool on a type nested inside an entity, or a local inside a
# method, is not the entity's field. $TYPE and $FIELD name the field in the message.
id: tm-house-no-stored-bool-swift
language: swift
message: stored Bool $TYPE.$FIELD on a persisted entity
severity: error
rule:
  kind: property_declaration
  has:
    kind: type_annotation
    regex: ^:\s*Bool\??$
  all:
    - has:
        field: name
        pattern: $FIELD
  not:
    any:
      - has:
          kind: computed_property
      - has:
          kind: modifiers
          has:
            kind: property_modifier
            regex: ^(static|class)$
  inside:
    kind: class_body
    inside:
      kind: class_declaration
      has:
        field: name
        regex: ^({{entity_types}})$
        pattern: $TYPE
