# A citation left in a Rust comment or test string: a line or block comment, doc comments included, or a string
# literal inside a #[test] function or a #[cfg(test)] module, whose text holds an R- or S-number, a D-number with or
# without its hyphen, a fact id after the word fact, or a label of Bob's name and a date in parentheses. A citation
# points at a record the reader may not have; the code should say the reason itself. A bare eight-hex id is not
# matched, since a short commit id looks the same. A string outside test code is not a comment and passes.
id: tm-house-no-register-citation-rust
language: rust
message: this comment or test string cites a register number, a fact id or a (Bob, date) label
severity: warning
utils:
  # A function or module whose attributes, read upward past other attributes and comments, include the test one.
  test-code:
    any:
      - kind: function_item
        follows:
          kind: attribute_item
          regex: ^#\[test\]$
          stopBy:
            not:
              any: [{ kind: attribute_item }, { kind: line_comment }, { kind: block_comment }]
      - kind: mod_item
        follows:
          kind: attribute_item
          regex: ^#\[cfg\(test\)\]$
          stopBy:
            not:
              any: [{ kind: attribute_item }, { kind: line_comment }, { kind: block_comment }]
rule:
  regex: '\b[RS]-[0-9]+\b|\bD-?[0-9]+\b|\bfacts? [0-9a-f]{8}\b|\(Bob,? ([0-9]{4}-)?[0-9]{2}-[0-9]{2}'
  any:
    - kind: line_comment
    - kind: block_comment
    - any: [{ kind: string_literal }, { kind: raw_string_literal }]
      inside: { matches: test-code, stopBy: end }
