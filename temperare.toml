# Temperare's own rule file: the repository is checked by itself.
version = 1
owner = "orc"

[kits.procio]
paths = ["crates/procio/**"]
owner = "procio"

[[rule]]
id = "programs-run-only-in-procio"
engine = "ast-grep"
check = "rules/programs-run-only-in-procio.yml"
paths = ["crates/**/*.rs"]
outside_kits = ["procio"]
severity = "error"
fix = "Run other programs through procio (procio::run, procio::Cmd); only procio starts a process."
